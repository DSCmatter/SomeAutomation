<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
</head>
<body>
  <h1>Welcome</h1>
  <label>
    Email
    <input type="email">
  </label>
  <button type="button">Continue</button>
  <p id="out"></p>
  <script>
    document.querySelector('button').addEventListener('click', () => {
      const email = document.querySelector('input').value.trim();
      document.querySelector('#out').textContent = email
        ? 'Dashboard for ' + email
        : 'Enter an email';
    });
  </script>
</body>
</html>
